version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: san_thuong_mai_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234567 # Thay đổi mật khẩu tại đây
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: san_thuong_mai_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # Port giao tiếp AMQP cho các service
      - "15672:15672" # Port cho giao diện UI quản lý RabbitMQ

volumes:
  pgdata:
  rabbitmq_data:
